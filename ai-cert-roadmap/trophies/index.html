<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>AI 자격증 전리품</title>
  <meta name="description" content="AI 자격증 2년 로드맵에서 받은 수료 배지와 자격증 모음. 배지 이미지, 원본 PDF, 공식 검증 링크">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #F7F7F4; --surface: #FFFFFF; --ink: #1A1F2B; --ink-2: #4B5364; --muted: #8A919F;
      --line: #E1E3DE; --line-strong: #1A1F2B;
      --accent: #2F6FB3; --accent-ink: #1F5590; --accent-soft: #E6EEF7;
      --gold: #B7791F; --gold-soft: #FBF1DE;
      --ok-bg: #E7F5EC; --ok-ink: #1E6B3A;
      --p0: #6B7280; --p1: #2F6FB3; --p2: #7C4DBD; --p3: #C2410C; --pb: #0F766E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171D; --surface: #1B1F27; --ink: #EEF0F3; --ink-2: #BFC6D1; --muted: #7F8794;
        --line: #2A2F3A; --line-strong: #EEF0F3;
        --accent: #6EA8E6; --accent-ink: #9CC4F0; --accent-soft: #1E2A3A;
        --gold: #E8B45A; --gold-soft: #2E2616;
        --ok-bg: #1A2E22; --ok-ink: #8ED4A6;
        --p0: #9CA3AF; --p1: #6EA8E6; --p2: #B394E8; --p3: #F0905C; --pb: #5EC4B8;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 36px 96px; }
    a { color: var(--accent-ink); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .home { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); padding: 4px 0; }
    .home:hover { color: var(--accent-ink); text-decoration: none; }
    header { margin-top: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--line-strong); display: grid; gap: 12px; }
    .eyebrow { font-family: "Bricolage Grotesque", "Noto Sans KR", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
    h1 { font-family: "Bricolage Grotesque", "Noto Sans KR", sans-serif; font-weight: 800; font-size: clamp(30px, 7vw, 42px); letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
    .lead { color: var(--ink-2); margin: 0; }
    h2 { font-family: "Bricolage Grotesque", "Noto Sans KR", sans-serif; font-size: 24px; font-weight: 800; margin: 56px 0 12px; padding-top: 8px; border-top: 3px solid var(--line-strong); display: flex; align-items: baseline; gap: 10px; }
    h2 .n { color: var(--gold); font-size: 16px; }

    /* 진행률 */
    .score { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; margin-top: 4px; }
    .score .big { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 40px; line-height: 1; }
    .score .big small { font-size: 18px; color: var(--muted); font-weight: 700; }
    .progress { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .progress i { display: block; height: 100%; background: var(--gold); border-radius: 999px; }
    .score .cap { grid-column: 2; font-size: 13px; color: var(--muted); }

    /* 획득한 배지 카드 */
    .trophy { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; margin: 16px 0; }
    .trophy .img { display: block; background: #fff; border-bottom: 1px solid var(--line); }
    .trophy .img img { display: block; width: 100%; height: auto; }
    .trophy .body { padding: 16px 18px 18px; display: grid; gap: 10px; }
    .trophy .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .trophy h3 { margin: 0; font-size: 20px; font-weight: 800; }
    .tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
    .tag.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .tag.gold { background: var(--gold-soft); color: var(--gold); }
    dl.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
    dl.meta dt { color: var(--muted); }
    dl.meta dd { margin: 0; overflow-wrap: anywhere; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .btn:hover { text-decoration: none; border-color: var(--accent); color: var(--accent-ink); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { color: #fff; filter: brightness(1.08); }

    /* 남은 슬롯 */
    .shelf { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .shelf li { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
    .shelf li.got { border-style: solid; border-color: var(--gold); background: var(--gold-soft); }
    .shelf .ph { font-size: 11.5px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .shelf .ph i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
    .shelf .nm { font-weight: 700; font-size: 14px; }
    .shelf .wh { font-size: 12.5px; color: var(--muted); }
    .shelf li.got .wh { color: var(--gold); font-weight: 700; }

    footer { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<div class="wrap">
  <a class="home" href="../">← 로드맵으로</a>

  <header>
    <div class="eyebrow">Trophy Room</div>
    <h1>AI 자격증 전리품</h1>
    <p class="lead">2년 로드맵에서 하나씩 받는 수료 배지와 자격증을 모아 둔 곳입니다. 배지 이미지, 원본 PDF, 발급 기관의 공식 검증 링크를 함께 둡니다.</p>
    <div class="score">
      <div class="big" id="got">0<small> / 0</small></div>
      <div class="progress"><i id="bar"></i></div>
      <div class="cap" id="cap"></div>
    </div>
  </header>

  <h2><span class="n">01</span>획득</h2>
  <div id="earned"></div>

  <h2><span class="n">02</span>진열장</h2>
  <p style="color:var(--ink-2);margin:0">로드맵 순서대로 놓은 빈자리입니다. 받으면 금색으로 채워집니다.</p>
  <ul class="shelf" id="shelf"></ul>

  <footer>배지 검증은 각 발급 기관의 링크에서 확인할 수 있습니다. 자격증 일정은 <a href="../#timeline">로드맵 전체 타임라인</a> 기준입니다.</footer>
</div>

<script>
// 전리품 목록 — 새로 받으면 해당 항목에 earned 정보를 채운다
var ITEMS = [
  { ph: "p0", phase: "0단계", name: "Claude 101", org: "Claude Academy (Anthropic)", plan: "1주차",
    earned: { date: "2026-11-12", type: "Course Completion Badge", img: "files/claude-101.jpg", pdf: "files/claude-101.pdf",
              verify: "https://academy.claude.com/verify/19bf5189bcf249d5d51b2ca2f81950f1" } },
  { ph: "p0", phase: "0단계", name: "AWS Skill Builder 수료증", org: "AWS", plan: "2주차" },
  { ph: "p0", phase: "0단계", name: "OpenAI Academy 수료증", org: "OpenAI", plan: "3주차" },
  { ph: "p1", phase: "1단계", name: "AWS Certified AI Practitioner (AIF-C01)", org: "AWS", plan: "2027-01" },
  { ph: "p2", phase: "2단계", name: "AWS Certified ML Engineer – Associate (MLA-C02)", org: "AWS", plan: "2027-05" },
  { ph: "p3", phase: "3단계", name: "AWS Certified Generative AI Developer – Professional (AIP-C01)", org: "AWS", plan: "2027-11" },
  { ph: "pb", phase: "4단계", name: "NVIDIA NCA-GENL", org: "NVIDIA", plan: "2028-02" },
  { ph: "pb", phase: "4단계", name: "NVIDIA NCP-GENL", org: "NVIDIA", plan: "2028-05" },
  { ph: "pb", phase: "5단계", name: "AICE Associate", org: "KT · 한국경제신문", plan: "2028-06" },
  { ph: "pb", phase: "6단계", name: "Google Generative AI Leader", org: "Google Cloud", plan: "2028-06" },
  { ph: "pb", phase: "6단계", name: "Google Professional ML Engineer", org: "Google Cloud", plan: "2028-09" },
  { ph: "pb", phase: "7단계", name: "Azure AI Fundamentals (AI-901)", org: "Microsoft", plan: "2028-09" },
  { ph: "pb", phase: "7단계", name: "Azure AI Engineer (AI-103)", org: "Microsoft", plan: "2028-11" }
];

(function () {
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var got = ITEMS.filter(function (x) { return x.earned; });

  // 진행률
  document.getElementById("got").innerHTML = got.length + "<small> / " + ITEMS.length + "</small>";
  document.getElementById("bar").style.width = (got.length / ITEMS.length * 100) + "%";
  document.getElementById("cap").textContent = "수료증 3 + 자격증 10 중 " + got.length + "개 획득";

  // 획득 카드 (최근 것이 위로)
  document.getElementById("earned").innerHTML = got.slice().reverse().map(function (x) {
    var e = x.earned;
    return '<article class="trophy">' +
      '<a class="img" href="' + esc(e.pdf) + '" target="_blank" rel="noopener"><img src="' + esc(e.img) + '" alt="' + esc(x.name) + ' 배지" loading="lazy"></a>' +
      '<div class="body">' +
        '<div class="top"><h3>' + esc(x.name) + '</h3><span class="tag ok">획득</span><span class="tag gold">' + esc(x.phase) + '</span></div>' +
        '<dl class="meta">' +
          '<dt>종류</dt><dd>' + esc(e.type) + '</dd>' +
          '<dt>발급</dt><dd>' + esc(x.org) + '</dd>' +
          '<dt>발급일</dt><dd>' + esc(e.date) + ' (계획: ' + esc(x.plan) + ')</dd>' +
          '<dt>검증</dt><dd><a href="' + esc(e.verify) + '" target="_blank" rel="noopener">' + esc(e.verify.replace(/^https?:\/\//, "")) + '</a></dd>' +
        '</dl>' +
        '<div class="btns">' +
          '<a class="btn primary" href="' + esc(e.verify) + '" target="_blank" rel="noopener">공식 검증 페이지 ↗</a>' +
          '<a class="btn" href="' + esc(e.pdf) + '" target="_blank" rel="noopener">PDF 보기</a>' +
          '<a class="btn" href="' + esc(e.pdf) + '" download>PDF 다운로드</a>' +
        '</div>' +
      '</div></article>';
  }).join("");

  // 진열장
  document.getElementById("shelf").innerHTML = ITEMS.map(function (x) {
    return '<li class="' + (x.earned ? "got" : "") + '">' +
      '<span class="ph"><i style="background:var(--' + x.ph + ')"></i>' + esc(x.phase) + ' · ' + esc(x.org) + '</span>' +
      '<span class="nm">' + (x.earned ? "🏆 " : "") + esc(x.name) + '</span>' +
      '<span class="wh">' + (x.earned ? esc(x.earned.date) + " 획득" : "예정 " + esc(x.plan)) + '</span></li>';
  }).join("");
})();
</script>
</body>
</html>
